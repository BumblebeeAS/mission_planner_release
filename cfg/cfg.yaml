static_transform_fish:
  ros__parameters:
    # Translation (x, y, z in meters)
    x: 0.429
    y: -0.084
    z: 0.5

    roll: 90.0          # in degrees
    pitch: 90.0      # in degrees
    yaw: 0.0        # in degrees

    # Frame IDs
    parent_frame_id: "advay_please_remove_this"
    child_frame_id: "auv4/torpedo/fish_hole"

static_transform_shark:
  ros__parameters:
    # Translation (x, y, z in meters)
    x: 0.319
    y: -0.336
    z: 0.5

    roll: 90.0          # in degrees
    pitch: 90.0         # in degrees
    yaw: 0.0           # in degrees

    # Frame IDs
    parent_frame_id: "advay_please_remove_this"
    child_frame_id: "auv4/torpedo/shark_hole"

