# =============================================================================
# STATIC TRANSFORM CONFIGURATION
# =============================================================================
# This file defines static transforms for AUV4 competition tasks.
# This config is loaded by main.launch.py which launches a static_transform_publisher
# node for each transform defined here.
#
# COORDINATE CONVENTIONS:
# - parent_frame_id: Reference frame
# - child_frame_id: Target frame
# - Translation: x, y, z in meters
# - Rotation: roll, pitch, yaw in degrees
#
# CURRENT CONVENTION:
# - The current convention of frames that are outputted by our pose estimators is as follows.
# - While FACING the object,
# - origin is at the top left corner of the object;
# - +x is to the right;
# - +y is downwards;
# - +z is pointing into the object plane away from the camera (or apply the right hand rule).
# - To make any child frames defined with respect to this estimator frame align with base_link_ned of the AUV,
#   we need to apply a rotation of roll = -90, pitch = -90, yaw = 0 degrees.
#
# USAGE:
# 1. Create a new comment header for each task.
# 2. Define the transforms in the format below.
# 3. Visually verify the frames in foxglove (we might not be handling extrinsic/intrinsic rotations correctly).
#
# =============================================================================
# A NOTE ON TRANSFORMS:
# Note that for a transform from frame A to frame B defined here, the inputted rotation R
# and the translation vector t here in fact define the INVERSE transform f^-1: B -> A. To see
# this, note that given a point x in frame A, to get the corresponding point in frame B, we
# translate back to the origin by -t and reverse the rotation by R^T. Thus f: A -> B is defined by
# f(x) = R^T(x - t). But then inverting this map gives us f^-1: B -> A defined by exactly
# f^-1(x) = Rx + t, as desired.
#
# Moral of the story: if you want to retrieve the numbers in this file, you need to query the transform
# from the parent frame to the child frame, not the other way around.
# =============================================================================

tfs:
######################### TORPEDO 2 TFS #########################
  - name: torpedo_fish
    # Translation (x, y, z in meters)
    x: 0.429
    y: 0.084
    z: -0.5
    roll: -90.0          # in degrees
    pitch: -90.0      # in degrees
    yaw: 0.0        # in degrees
    # Frame IDs
    parent_frame_id: "auv4/torpedo_2/clustered"
    child_frame_id: "auv4/torpedo_2/fish"
  - name: torpedo_shark
