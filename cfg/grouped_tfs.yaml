torpedo:
  - name: torpedo_1_fish
    suffix: fish
    parents:
      - "torpedo_1_0"
      - "torpedo_1/yolo"
    x: 0.408
    y: 0.391
  - name: torpedo_1_shark
    suffix: shark
    parents:
      - "torpedo_1_0"
      - "torpedo_1/yolo"
    x: 0.268
    y: 0.09
  - name: torpedo_2_fish
    suffix: fish
    parents:
      - "torpedo_2_0"
      - "torpedo_2/yolo"
    x: 0.429
    y: 0.084
  - name: torpedo_2_shark
    suffix: shark
    parents:
      - "torpedo_2_0"
      - "torpedo_2/yolo"
    x: 0.319
    y: 0.336
  - name: centre_view
    parents:
      - "torpedo/centre"
    z: -0.7
    roll: -90.0
    pitch: -90.0
  - name: shoot_view
    parents:
      - "torpedo_1_0/fish"
      - "torpedo_1_0/shark"
      - "torpedo_2_0/fish"
      - "torpedo_2_0/shark"
    z: -0.45
    roll: -90.0
    pitch: -90.0
gate:
  - name: centre_view
    parents:
      - "gate/centre"
    y: 0.7
    z: -2.0
    roll: -90.0
    pitch: -90.0
  - name: centre_after_gate
    suffix: after_gate
    parents:
     - "gate/centre"
    y: 0.7
    z: 2.0
    roll: -90.0
    pitch: -90.0
  - name: left_right_view
    parents:
      - "gate/left"
      - "gate/right"
    y: 0.7
    z: -1.0
    roll: -90.0
    pitch: -90.0
bin:
  - name: top_view
    parents:
      - "bin/centre"
      - "bin/fish"
      - "bin/shark"
      - "bin/fish/rotated"
      - "bin/shark/rotated"
    z: -0.65
    yaw: -90.0
